[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "us-flight-delay-mlops"
version = "0.1.0"
description = "Leakage-safe foundation for pre-departure U.S. flight delay prediction."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3==1.40.0",
    "cachetools==6.2.6",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "joblib==1.5.3",
    "matplotlib==3.11.1",
    "pandas==2.3.1",
    "pydantic==2.11.7",
    "PyYAML==6.0.2",
    "scikit-learn==1.9.0",
    "streamlit==1.47.1",
    "uvicorn[standard]==0.35.0",
    "wandb==0.28.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.7",
]
v1 = [
    "catboost==1.2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["flight_delay"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.format]
quote-style = "double"
