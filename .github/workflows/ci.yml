name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --disable-pip-version-check -c requirements.lock ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test with coverage
        run: pytest --cov=flight_delay --cov-branch --cov-report=term-missing --cov-fail-under=80
        env:
          WANDB_MODE: disabled
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t flight-delay-api:scaffold .
      - name: Build user UI image
        run: docker build -f services/user_ui/Dockerfile -t flight-delay-user-ui:scaffold .
      - name: Build monitoring UI image
        run: docker build -f services/monitor_ui/Dockerfile -t flight-delay-monitor-ui:scaffold .
