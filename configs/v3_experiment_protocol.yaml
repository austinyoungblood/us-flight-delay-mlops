deterministic_seasonal_semantics:
  computed_solely_from_scheduled_flight_date: true
  no_target_or_label_input: true
  identical_in_training_and_serving: true
  day_of_year:
    ordinal: iso_day_of_year_1_through_366
    days_in_year: 366_if_gregorian_leap_year_else_365
    angle_radians: 2 * pi * (day_of_year - 1) / days_in_year
    day_of_year_sin: sin(angle_radians)
    day_of_year_cos: cos(angle_radians)
  thanksgiving:
    definition: fourth_Thursday_of_November
    algorithm: november_1 + ((3 - november_1.weekday()) mod 7) + 21_days
    anchor_candidates: [flight_year_minus_1, flight_year, flight_year_plus_1]
    anchor_selection: minimum_absolute_signed_delta
    anchor_tie_break: earlier_anchor_date
  christmas:
    definition: december_25
    anchor_candidates: [flight_year_minus_1, flight_year, flight_year_plus_1]
    anchor_selection: minimum_absolute_signed_delta
    anchor_tie_break: earlier_anchor_date
  signed_delta_definition: (anchor_date - scheduled_flight_date).days
  signed_delta_sign_convention: positive_means_anchor_is_in_the_future
  bounded_distance:
    clip_lower: -30
    clip_upper: 30
    dtype: int
    rationale: >-
      Bounded distance keeps the feature finite, monotone near the holiday, and constant far away,
      so a single anchor-selection rule yields identical values in batch training and single-row
      serving without any dependence on the surrounding data.
  windows:
    is_thanksgiving_window:
      raw_signed_delta_inclusive_range: [-4, 2]
      description: Tuesday before Thanksgiving through the Monday after; 7 calendar days
    is_christmas_window:
      raw_signed_delta_inclusive_range: [-10, 4]
      description: December 21 through January 4; 15 calendar days
    window_flags_use_raw_signed_delta: true
    clipping_does_not_affect_window_flags: true
    dtype: int_0_or_1

historical_feature_state:
  schema: flight-delay-historical-state-v3
  prior_strength: 50
  smoothing_formula: (positive_count + prior_strength * historical_global_rate) / (count + prior_strength)
  unseen_category_fallback: historical_global_rate
  support_transform: log1p_count
  same_month_labels_permitted: false
  future_labels_permitted: false
  state_cutoff_rule: labels_strictly_before_model_row_month
  trailing_window_months: 3
  full_eligible_prior_history_required: true
  historical_state_sampling_permitted: false
  seasonal_tables:
    same_calendar_month_global:
      key: [calendar_month]
    same_calendar_month_carrier:
      key: [calendar_month, Reporting_Airline]
    same_calendar_month_origin:
      key: [calendar_month, Origin]
    same_calendar_month_destination:
      key: [calendar_month, Dest]
    same_calendar_month_route:
      key: [calendar_month, route]
  seasonal_prior_year_rule:
    prior_or_previous_occurrences_only: true
    same_month_same_year_contribution_prohibited: true
    enforcement: >-
      Every state cutoff is strictly before the first day of the model row month, so any
      same-calendar-month entry present in the state necessarily originates in a strictly earlier
      year. The implementation asserts this invariant when the state is built.
    november_2025_features_may_use_november_2024: true
    november_2025_targets_contribute_to_november_2025_features: false
  deterministic_serialization:
    format: canonical_json_utf8
    sort_keys: true
    compact_separators: true
    reject_nan: true
    digest: sha256
    lookup_entries_sorted_lexically: true
  bundle_reference:
    artifact_required: true
    exact_state_digest_required: true
    schema_digest_required: true
  november_and_december_state:
    as_of_inclusive: "2025-10-31"
    november_labels_update_state: false
    december_labels_update_state: false
  parity_requirement: batch_training_equals_single_row_serving

