      evaluation_start: "2025-10-01"
      evaluation_end_exclusive: "2025-11-01"
      evaluation_state_as_of: "2025-09-30"
  outer_evaluation_used_for_early_stopping: false

search_metric:
  primary: max_precision_at_operating_recall
  threshold_constraints:
    recall_min: 0.60
    predicted_positive_rate_max: 0.50
  no_qualifying_threshold_score: 0.0
  threshold_tie_break_order:
    - precision_desc
    - recall_desc
    - predicted_positive_rate_asc
    - distance_from_0_50_asc
    - threshold_desc
  recorded_metrics:
    - average_precision
    - roc_auc
    - brier_score
    - log_loss
    - best_f1_under_ppr_max
    - max_precision_at_operating_recall
    - operating_threshold
    - operating_recall
    - operating_ppr
    - prevalence
  candidate_ranking:
    - mean_max_precision_at_operating_recall_desc
    - worst_fold_max_precision_at_operating_recall_desc
    - mean_average_precision_desc
    - mean_roc_auc_desc
    - mean_log_loss_asc
    - mean_brier_score_asc
    - std_max_precision_at_operating_recall_asc
    - candidate_id_lexical_asc

