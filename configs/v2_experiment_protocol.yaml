    end_exclusive: "2025-02-01"
    contributes_model_rows: false
  model_period:
    start: "2025-02-01"
    end_exclusive: "2025-12-01"
  december_read_during_development: false
  january_through_november_only_during_development: true

feature_contract:
  base_feature_source: flight_delay.data.prepare.PROCESSED_FEATURES
  base_features:
    - Month
    - DayofMonth
    - DayOfWeek
    - Reporting_Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - route
    - scheduled_departure_hour
    - scheduled_arrival_hour
    - scheduled_departure_minute_bucket
    - scheduled_arrival_minute_bucket
    - is_weekend
    - scheduled_departure_sin
    - scheduled_departure_cos
    - scheduled_arrival_sin
    - scheduled_arrival_cos
  historical_features:
    - prior_global_delay_rate
    - prior_carrier_delay_rate
    - prior_origin_delay_rate
    - prior_destination_delay_rate
    - prior_route_delay_rate
    - prior_carrier_route_delay_rate
    - prior_carrier_origin_delay_rate
    - prior_carrier_destination_delay_rate
    - prior_origin_departure_hour_delay_rate
    - prior_destination_arrival_hour_delay_rate
    - log_route_support
    - log_carrier_route_support
    - recent_global_delay_rate_3m
    - recent_carrier_delay_rate_3m
    - recent_origin_delay_rate_3m
    - recent_destination_delay_rate_3m
    - recent_route_delay_rate_3m
  total_feature_count: 37
  categorical_features:
    - Reporting_Airline
    - Origin
    - Dest
    - route
  numeric_historical_features: 17
  ordering_only:
    - flight_date
  label_only:
    - target
  request_available_inputs_only: true
  postdeparture_features_permitted: false

historical_feature_state:
  schema: flight-delay-historical-state-v1
  prior_strength: 50
  smoothing_formula: (positive_count + prior_strength * historical_global_rate) / (count + prior_strength)
  unseen_category_fallback: historical_global_rate
  support_transform: log1p_count
  same_month_labels_permitted: false
  future_labels_permitted: false
  state_cutoff_rule: labels_strictly_before_model_row_month
  trailing_window_months: 3
  deterministic_serialization:
    format: canonical_json_utf8
    sort_keys: true
    compact_separators: true
    reject_nan: true
    digest: sha256
    lookup_entries_sorted_lexically: true
  bundle_reference:
    artifact_required: true
    exact_state_digest_required: true
    schema_digest_required: true
  november_and_december_state:
    as_of_inclusive: "2025-10-31"
    november_labels_update_state: false
    december_labels_update_state: false
  parity_requirement: batch_training_equals_single_row_serving

sampling:
  search_rows_per_month_max: 75000
  sample_seed: 42
  model_row_sampling: deterministic_without_replacement
  sampled_period:
    start: "2025-02-01"
    end_exclusive: "2025-11-01"
  historical_lookup_inputs: full_eligible_prior_month_rows
  final_refit_inputs: full_eligible_model_rows
  record_source_eligible_model_counts_and_hashes: true

candidate_generation:
  algorithm: seeded_greedy_maximin_normalized_parameter_index_v1
  seed: 42
  initial_point: first_after_seeded_shuffle
  distance: squared_euclidean_on_domain_indices_scaled_to_unit_interval
  next_point: maximum_minimum_distance
  tie_break: seeded_shuffle_order
  post_result_candidates_prohibited: true

model_families:
  lightgbm:
    estimator: LGBMClassifier
    package: lightgbm
    version: 4.7.0
    dependency_scope: modeling_optional
    native_categorical_features: true
  catboost:
    estimator: CatBoostClassifier
    package: catboost
    version: 1.2.10
    dependency_scope: modeling_optional
    native_categorical_features: true
  runtime_images_exclude_modeling_dependencies: true

execution_policy:
  sequential_candidate_execution: true
  lightgbm_screening:
    backend: CPU
    n_jobs: 20
  catboost_screening:
    backend: GPU
    task_type: GPU
    devices: "0"
    screening_only: true
    concurrent_gpu_fits: false
  cpu_confirmation:
    authoritative_for_advancement: true
    backend: CPU
    lightgbm_n_jobs: 20
    catboost_task_type: CPU
    candidate_hyperparameters_unchanged: true
  backend_excluded_from_candidate_identity: true
  full_data_refit_backend: CPU

rolling_origin:
  fold_count: 4
  folds:
    - id: FOLD_1
      fit_start: "2025-02-01"
      fit_end_exclusive: "2025-07-01"
      evaluation_start: "2025-07-01"
      evaluation_end_exclusive: "2025-08-01"
      evaluation_state_as_of: "2025-06-30"
