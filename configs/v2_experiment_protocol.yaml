calibration:
  period:
    start: "2025-11-01"
    end_exclusive: "2025-11-16"
  variants:
    - none
    - sigmoid
    - isotonic
  bases: 4
  finalist_count: 12
  base_frozen_before_calibration: true
  november_selection_rows_permitted: false

november_selection:
  period:
    start: "2025-11-16"
    end_exclusive: "2025-12-01"
  threshold_objective:
    eligibility:
      recall_min: 0.60
      precision_min: 0.30
      predicted_positive_rate_max: 0.50
    objective: maximize_f1
    tie_break_order:
      - f1_desc
      - precision_desc
      - recall_desc
      - predicted_positive_rate_asc
      - distance_from_0_50_asc
      - threshold_desc
    no_eligible_threshold_outcome: finalist_fails
  acceptance_gates:
    operating_point:
      recall_min: 0.60
      precision_min: 0.30
      f1_min: 0.38
      predicted_positive_rate_max: 0.50
    probability:
      brier_skill_score_vs_prior_strictly_positive: true
      brier_score_below_prior: true
      log_loss_below_prior: true
      absolute_probability_prevalence_gap_max: 0.03
      equal_frequency_ece_15_max: 0.03
    discrimination:
      frozen_r3_average_precision: 0.2823880567429311
      average_precision_margin_min: 0.01
      average_precision_absolute_min: 0.2923880567429311
      frozen_r3_roc_auc: 0.6281178113133866
      roc_auc_margin_min: 0.005
      roc_auc_absolute_min: 0.6331178113133866
    operational:
      single_row_inference_p95_ms_strict_max: 25
      serialized_bundle_bytes_strict_max: 10485760
    governance:
      lineage_verified: true
      schema_check_passed: true
      leakage_check_passed: true
      historical_state_integrity_passed: true
      training_serving_parity_passed: true
      r3_reconstruction_passed: true
      serialization_load_inference_passed: true
      no_prohibited_test_access: true
      no_training_convergence_or_runtime_failure: true
  every_gate_mandatory: true
  zero_pass_outcome: governed_stop_retain_production_v0
  winner_order:
    - max_precision_at_operating_recall_desc
    - average_precision_desc
    - roc_auc_desc
    - log_loss_asc
    - brier_score_asc
    - f1_desc
    - predicted_positive_rate_asc
    - finalist_id_lexical_asc
  improvement_claim_requires_all_gates: true
  v1_cb4_precision_at_recall_min_0_60: 0.276101388050694

